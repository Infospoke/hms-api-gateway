spring.application.name=api-gateway

server.port=5000

spring.cloud.gateway.routes[0].id=hms-service
spring.cloud.gateway.routes[0].uri=http://localhost:5005
spring.cloud.gateway.routes[0].predicates[0]=Path=/hms/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[1].id=websocket-route
spring.cloud.gateway.routes[1].uri=http://localhost:5005
spring.cloud.gateway.routes[1].predicates[0]=Path=/ws/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter